name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Auto Format
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Checkout head branch on PRs so formatted changes can be pushed
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Auto-format code
        run: |
          # Automatically format Go code with simplification flag (-s)
          gofmt -s -w .

      - name: Commit formatted code
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto-format code with gofmt -s"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    needs: [format]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Go Vet
        run: go vet ./...

      - name: Check module tidiness
        run: |
          go mod tidy
          # Only diff files that git already tracks. When the module has no
          # external dependencies go.sum is not created, and passing an
          # untracked path to git diff causes a fatal "no such path" error.
          git diff --exit-code -- go.mod $(git ls-files go.sum) \
            || (echo "go.mod or go.sum is not tidy. Run 'go mod tidy'" && exit 1)

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [format]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with Race Detection & Coverage
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  cross-compile:
    name: Build
    runs-on: ubuntu-latest
    needs: [format]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Cross-compile every supported target. Output goes to /dev/null since
      # we only care that compilation succeeds.
      - name: Compile all targets
        run: |
          set -x
          GOOS=linux GOARCH=amd64 go build -o /dev/null .
          GOOS=linux GOARCH=arm64 go build -o /dev/null .
          GOOS=linux GOARCH=arm GOARM=7 go build -o /dev/null .
          GOOS=darwin GOARCH=amd64 go build -o /dev/null .
          GOOS=darwin GOARCH=arm64 go build -o /dev/null .

  security:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [format]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
