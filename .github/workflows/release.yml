name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.9)"
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binaries
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
          GOOS=linux GOARCH=amd64  go build -ldflags="-s -w -X main.Version=$TAG" -o alps-linux-amd64 .
          GOOS=linux GOARCH=arm64  go build -ldflags="-s -w -X main.Version=$TAG" -o alps-linux-arm64 .
          GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w -X main.Version=$TAG" -o alps-linux-armv7 .

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            alps-linux-amd64
            alps-linux-arm64
            alps-linux-armv7
          generate_release_notes: ${{ inputs.tag == '' }}