name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (example: v0.1.1-1)"
        required: true

permissions:
  contents: write
  pull-requests: read

env:
  TARGET_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install Debian Packaging Tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            dpkg-dev apt-utils

      - name: Build binaries
        run: |
          TARGET_TAG=${{ inputs.tag || github.ref_name }}
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.Version=$TARGET_TAG" -o alps-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.Version=$TARGET_TAG" -o alps-linux-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w -X main.Version=$TARGET_TAG" -o alps-linux-armv7 .

          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w -X main.Version=$TARGET_TAG" -o alps-termux-aarch64 .

          CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 \
            CC="$NDK_BIN/armv7a-linux-androideabi24-clang" \
            go build -ldflags="-s -w -X main.Version=$TARGET_TAG" \
            -o alps-termux-arm .

          CGO_ENABLED=1 GOOS=android GOARCH=amd64 \
            CC="$NDK_BIN/x86_64-linux-android24-clang" \
            go build -ldflags="-s -w -X main.Version=$TARGET_TAG" \
            -o alps-termux-x86_64 .


      - name: Build Debian (.deb) Packages
        run: |
          for ARCH in amd64 arm64 armv7; do
            rm -rf pkg
            mkdir -p pkg/usr/local/bin \
                     pkg/usr/share/fish/vendor_completions.d \
                     pkg/usr/share/bash-completion/completions \
                     pkg/usr/share/zsh/site-functions \
                     pkg/etc/apt/sources.list.d \
                     pkg/DEBIAN

            cp alps-linux-$ARCH pkg/usr/local/bin/alps

            ./alps-linux-amd64 completion fish > pkg/usr/share/fish/vendor_completions.d/alps.fish
            ./alps-linux-amd64 completion bash > pkg/usr/share/bash-completion/completions/alps
            ./alps-linux-amd64 completion zsh > pkg/usr/share/zsh/site-functions/_alps

            echo "deb [trusted=yes] https://adrianpriza-ai.github.io/alps-apt stable main" > pkg/etc/apt/sources.list.d/alps.list

            DEBARCH=$ARCH
            [[ "$ARCH" == "armv7" ]] && DEBARCH="armhf"

            cat <<EOF > pkg/DEBIAN/control
            Package: alps
            Version: ${TARGET_TAG#v}
            Section: utils
            Priority: optional
            Architecture: $DEBARCH
            Maintainer: adrianpriza-ai
            Description: Advanced Linux Package System
            EOF

            echo -e '#!/bin/sh\napt update || true\nexit 0' > pkg/DEBIAN/postinst
            chmod 755 pkg/DEBIAN/postinst

            dpkg-deb --build pkg alps_${TARGET_TAG#v}_$DEBARCH.deb
          done
          rm -rf pkg

      - name: Generate Checksums
        run: |
          sha256sum alps-linux-* alps-termux-* *.deb > SHA256SUMS

      - name: Checkout APT Repository
        uses: actions/checkout@v4
        with:
          repository: adrianpriza-ai/alps-apt
          token: ${{ secrets.REPO_TOKEN }}
          path: repo

      - name: Update APT Repository Metadata
        run: |
          cd repo
          mkdir -p pool/main/{amd64,arm64,armhf} \
                   dists/stable/main/{binary-amd64,binary-arm64,binary-armhf,binary-all}

          cp ../alps_${TARGET_TAG#v}_amd64.deb pool/main/amd64/
          cp ../alps_${TAG#v}_arm64.deb pool/main/arm64/
          cp ../alps_${TARGET_TAG#v}_armhf.deb pool/main/armhf/

          for ARCH in amd64 arm64 armhf; do
            dpkg-scanpackages --multiversion pool/main/$ARCH > dists/stable/main/binary-$ARCH/Packages
            gzip -kf dists/stable/main/binary-$ARCH/Packages
          done

          touch dists/stable/main/binary-all/Packages
          gzip -kf dists/stable/main/binary-all/Packages

          cat <<EOF > apt.conf
          APT::FTPArchive::Release {
            Origin "ALPS";
            Label "ALPS";
            Suite "stable";
            Codename "stable";
            Architectures "amd64 arm64 armhf all";
            Components "main";
            Description "ALPS APT Repository";
          };
          EOF

          apt-ftparchive -c apt.conf release dists/stable > dists/stable/Release

      - name: Push Updates to APT Repository
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Release $TARGET_TAG" || true
          git push

      - name: Create GitHub Release Asset
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          generate_release_notes: ${{ inputs.tag == '' }}
          files: |
            alps-linux-*
            alps-termux-*
            *.deb
            SHA256SUMS
