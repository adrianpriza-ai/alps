name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (example: v1.0.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    name: Pre-Release Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -v -race ./...

  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    needs: [validate]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Build binaries
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
           
          GOOS=linux GOARCH=amd64 \
            go build \
            -ldflags="-s -w -X main.Version=$TAG" \
            -o alps-linux-amd64 .
             
          GOOS=linux GOARCH=arm64 \
            go build \
            -ldflags="-s -w -X main.Version=$TAG" \
            -o alps-linux-arm64 .
             
          GOOS=linux GOARCH=arm GOARM=7 \
            go build \
            -ldflags="-s -w -X main.Version=$TAG" \
            -o alps-linux-armv7 .
             
          GOOS=darwin GOARCH=amd64 \
            go build \
            -ldflags="-s -w -X main.Version=$TAG" \
            -o alps-darwin-amd64 .
             
          GOOS=darwin GOARCH=arm64 \
            go build \
            -ldflags="-s -w -X main.Version=$TAG" \
            -o alps-darwin-arm64 .

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-r27d
          key: ndk-r27d-linux-x86_64

      - name: Download Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          rm -f android-ndk-r27d-linux.zip

      - name: Set Android NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=${{ github.workspace }}/android-ndk-r27d" >> $GITHUB_ENV

      - name: Build Termux binaries
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          GOEXPERIMENT=nodwarf5 CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            CC="$NDK_BIN/aarch64-linux-android24-clang" \
            go build -ldflags="-s -w -X main.Version=$TAG" -o alps-termux-aarch64 .
          
          CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 \
            CC="$NDK_BIN/armv7a-linux-androideabi24-clang" \
            go build -ldflags="-s -w -X main.Version=$TAG" -o alps-termux-arm .
          
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 \
            CC="$NDK_BIN/x86_64-linux-android24-clang" \
            go build -ldflags="-s -w -X main.Version=$TAG" -o alps-termux-x86_64 .

      - name: Build .deb packages
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
          
          for ARCH in amd64 arm64 armv7; do
            rm -rf pkg
            
            mkdir -p pkg/usr/local/bin
            mkdir -p pkg/usr/share/fish/vendor_completions.d
            mkdir -p pkg/usr/share/bash-completion/completions
            mkdir -p pkg/usr/share/zsh/site-functions
            mkdir -p pkg/etc/apt/sources.list.d
            mkdir -p pkg/DEBIAN
            
            cp alps-linux-$ARCH pkg/usr/local/bin/alps
            
            ./alps-linux-amd64 completion fish > pkg/usr/share/fish/vendor_completions.d/alps.fish
            ./alps-linux-amd64 completion bash > pkg/usr/share/bash-completion/completions/alps
            ./alps-linux-amd64 completion zsh > pkg/usr/share/zsh/site-functions/_alps
            
            echo "deb [signed-by=/usr/share/keyrings/alps-archive-keyring.gpg] https://adrianpriza-ai.github.io/alps-apt stable main" \
              > pkg/etc/apt/sources.list.d/alps.list
              
            DEBARCH=$ARCH
            if [ "$ARCH" = "armv7" ]; then
              DEBARCH="armhf"
            fi
            
            echo "Package: alps" > pkg/DEBIAN/control
            echo "Version: ${TAG#v}" >> pkg/DEBIAN/control
            echo "Section: utils" >> pkg/DEBIAN/control
            echo "Priority: optional" >> pkg/DEBIAN/control
            echo "Architecture: $DEBARCH" >> pkg/DEBIAN/control
            echo "Maintainer: adrianpriza-ai" >> pkg/DEBIAN/control
            echo "Description: Advanced Linux Package System" >> pkg/DEBIAN/control
            
            echo '#!/bin/sh' > pkg/DEBIAN/postinst
            echo 'set -e' >> pkg/DEBIAN/postinst
            echo '' >> pkg/DEBIAN/postinst
            echo '# Install the ALPS archive GPG key' >> pkg/DEBIAN/postinst
            echo 'if [ ! -f /usr/share/keyrings/alps-archive-keyring.gpg ]; then' >> pkg/DEBIAN/postinst
            echo '  mkdir -p /usr/share/keyrings' >> pkg/DEBIAN/postinst
            echo '  curl -fsSL https://adrianpriza-ai.github.io/alps-apt/alps-archive-keyring.gpg -o /usr/share/keyrings/alps-archive-keyring.gpg' >> pkg/DEBIAN/postinst
            echo 'fi' >> pkg/DEBIAN/postinst
            echo '' >> pkg/DEBIAN/postinst
            echo '# Update package list' >> pkg/DEBIAN/postinst
            echo 'apt update || true' >> pkg/DEBIAN/postinst
            echo 'exit 0' >> pkg/DEBIAN/postinst
            chmod 755 pkg/DEBIAN/postinst
            
            dpkg-deb --build pkg alps_${TAG#v}_$DEBARCH.deb
          done
          
          rm -rf pkg

      - name: Generate checksums
        run: |
           sha256sum \
           alps-linux-amd64 \
           alps-linux-arm64 \
           alps-linux-armv7 \
           alps-termux-aarch64 \
           alps-termux-arm \
           alps-termux-x86_64 \
           alps-darwin-amd64 \
           alps-darwin-arm64 \
           *.deb \
           > SHA256SUMS

      - name: Clone APT repository
        run: |
          git clone \
            https://x-access-token:${{ secrets.REPO_TOKEN }}@github.com/adrianpriza-ai/alps-apt.git \
            repo

      - name: Update APT repository
        run: |
          TAG=${{ inputs.tag || github.ref_name }}

          cd repo

          mkdir -p pool/main/amd64
          mkdir -p pool/main/arm64
          mkdir -p pool/main/armhf
          mkdir -p dists/stable/main/binary-amd64
          mkdir -p dists/stable/main/binary-arm64
          mkdir -p dists/stable/main/binary-armhf
          mkdir -p dists/stable/main/binary-all

          cp ../alps_${TAG#v}_amd64.deb  pool/main/amd64/
          cp ../alps_${TAG#v}_arm64.deb  pool/main/arm64/
          cp ../alps_${TAG#v}_armhf.deb  pool/main/armhf/

          dpkg-scanpackages --multiversion pool/main/amd64 > dists/stable/main/binary-amd64/Packages
          gzip -kf dists/stable/main/binary-amd64/Packages

          dpkg-scanpackages --multiversion pool/main/arm64 > dists/stable/main/binary-arm64/Packages
          gzip -kf dists/stable/main/binary-arm64/Packages

          dpkg-scanpackages --multiversion pool/main/armhf > dists/stable/main/binary-armhf/Packages
          gzip -kf dists/stable/main/binary-armhf/Packages

          touch dists/stable/main/binary-all/Packages
          gzip -kf dists/stable/main/binary-all/Packages

          echo "APT::FTPArchive::Release {" > apt.conf
          echo "  Origin \"ALPS\";" >> apt.conf
          echo "  Label \"ALPS\";" >> apt.conf
          echo "  Suite \"stable\";" >> apt.conf
          echo "  Codename \"stable\";" >> apt.conf
          echo "  Architectures \"amd64 arm64 armhf all\";" >> apt.conf
          echo "  Components \"main\";" >> apt.conf
          echo "  Description \"ALPS APT Repository\";" >> apt.conf
          echo "};" >> apt.conf

          apt-ftparchive \
            -c apt.conf \
            release dists/stable \
            > dists/stable/Release

          # Security: Generate signed InRelease file (requires GPG key setup)
          # This step requires a GPG key to be configured as a secret
          if [ -n "${{ secrets.APT_GPG_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --import --batch --passphrase "${{ secrets.APT_GPG_PASSPHRASE }}"
            gpg --batch --passphrase "${{ secrets.APT_GPG_PASSPHRASE }}" --detach-sign --armor --output dists/stable/Release.gpg dists/stable/Release
            gpg --batch --passphrase "${{ secrets.APT_GPG_PASSPHRASE }}" --clearsign --output dists/stable/InRelease dists/stable/Release
            # Export public key for distribution
            gpg --batch --passphrase "${{ secrets.APT_GPG_PASSPHRASE }}" --armor --export --output alps-archive-keyring.gpg
          else
            echo "Warning: APT_GPG_PRIVATE_KEY not set, skipping repository signing"
            echo "Repository will be unsigned - this is not recommended for production"
          fi

      - name: Push APT repository
        run: |
          cd repo
          
          git config user.name github-actions
          git config user.email github-actions@github.com
          
          git add .
          git commit -m "Release ${{ inputs.tag || github.ref_name }}" || true
          git push

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: ${{ inputs.tag == '' }}
          files: |
            alps-linux-amd64
            alps-linux-arm64
            alps-linux-armv7

            alps-termux-aarch64
            alps-termux-arm
            alps-termux-x86_64

            alps-darwin-amd64
            alps-darwin-arm64

            *.deb

            SHA256SUMS
