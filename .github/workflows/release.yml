name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (example: v1.0.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    name: Pre-Release Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Go Vet
        run: go vet ./...

      - name: Check module tidiness
        run: |
          go mod tidy
          git diff --exit-code -- go.mod $(git ls-files go.sum) \
            || (echo "go.mod or go.sum is not tidy. Run 'go mod tidy'" && exit 1)

      - name: Run tests with race detection
        run: go test -v -race -covermode=atomic ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: alps-linux-amd64
          - goos: linux
            goarch: arm64
            output: alps-linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            output: alps-linux-armv7
          - goos: darwin
            goarch: amd64
            output: alps-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: alps-darwin-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
          go build \
            -ldflags="-s -w -X main.Version=$TAG" \
            -o ${{ matrix.output }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          retention-days: 1

  build-termux:
    name: Build Termux ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            cc: aarch64-linux-android24-clang
            output: alps-termux-aarch64
          - goarch: arm
            goarm: "7"
            cc: armv7a-linux-androideabi24-clang
            output: alps-termux-arm
          - goarch: amd64
            cc: x86_64-linux-android24-clang
            output: alps-termux-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-r27d
          key: ndk-r27d-linux-x86_64

      - name: Download Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget --retry-connrefused --waitretry=1 --read-timeout=20 --timeout=15 -t 3 -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          rm -f android-ndk-r27d-linux.zip

      - name: Build Termux binary
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-r27d
          GOARM: ${{ matrix.goarm }}
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          GOEXPERIMENT=nodwarf5 CGO_ENABLED=1 GOOS=android GOARCH=${{ matrix.goarch }} \
            CC="$NDK_BIN/${{ matrix.cc }}" \
            go build -ldflags="-s -w -X main.Version=$TAG" -o ${{ matrix.output }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          retention-days: 1

  package:
    name: Build Debian Packages
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Build .deb packages
        run: |
          TAG=${{ inputs.tag || github.ref_name }}

          # Completions are shell scripts — identical for every arch.
          # Generate them once from the native amd64 binary to avoid
          # "Exec format error" when trying to run arm64/armv7 binaries
          # on the amd64 runner.
          chmod +x artifacts/alps-linux-amd64/alps-linux-amd64
          mkdir -p /tmp/alps-completions
          artifacts/alps-linux-amd64/alps-linux-amd64 completion fish > /tmp/alps-completions/alps.fish
          artifacts/alps-linux-amd64/alps-linux-amd64 completion bash > /tmp/alps-completions/alps
          artifacts/alps-linux-amd64/alps-linux-amd64 completion zsh > /tmp/alps-completions/_alps

          for ARCH in amd64 arm64 armv7; do
            rm -rf pkg

            mkdir -p pkg/usr/local/bin
            mkdir -p pkg/usr/share/fish/vendor_completions.d
            mkdir -p pkg/usr/share/bash-completion/completions
            mkdir -p pkg/usr/share/zsh/site-functions
            mkdir -p pkg/usr/share/keyrings
            mkdir -p pkg/etc/apt/sources.list.d
            mkdir -p pkg/DEBIAN

            cp artifacts/alps-linux-$ARCH/alps-linux-$ARCH pkg/usr/local/bin/alps
            chmod +x pkg/usr/local/bin/alps

            cp /tmp/alps-completions/alps.fish pkg/usr/share/fish/vendor_completions.d/alps.fish
            cp /tmp/alps-completions/alps pkg/usr/share/bash-completion/completions/alps
            cp /tmp/alps-completions/_alps pkg/usr/share/zsh/site-functions/_alps

            cp packaging/alps-archive-keyring.gpg pkg/usr/share/keyrings/alps-archive-keyring.gpg
            chmod 644 pkg/usr/share/keyrings/alps-archive-keyring.gpg

            echo "deb [signed-by=/usr/share/keyrings/alps-archive-keyring.gpg] https://adrianpriza-ai.github.io/alps-apt stable main" \
              > pkg/etc/apt/sources.list.d/alps.list

            DEBARCH=$ARCH
            if [ "$ARCH" = "armv7" ]; then
              DEBARCH="armhf"
            fi

            echo "Package: alps" > pkg/DEBIAN/control
            echo "Version: ${TAG#v}" >> pkg/DEBIAN/control
            echo "Section: utils" >> pkg/DEBIAN/control
            echo "Priority: optional" >> pkg/DEBIAN/control
            echo "Architecture: $DEBARCH" >> pkg/DEBIAN/control
            echo "Maintainer: adrianpriza-ai" >> pkg/DEBIAN/control
            echo "Description: Advanced Linux Package System" >> pkg/DEBIAN/control

            echo '#!/bin/sh' > pkg/DEBIAN/postinst
            echo 'set -e' >> pkg/DEBIAN/postinst
            echo '' >> pkg/DEBIAN/postinst
            echo '# Ensure keyring permissions and dearmor if older ASCII version exists' >> pkg/DEBIAN/postinst
            echo 'chmod 644 /usr/share/keyrings/alps-archive-keyring.gpg 2>/dev/null || true' >> pkg/DEBIAN/postinst
            echo 'if [ -f /usr/share/keyrings/alps-archive-keyring.gpg ] && grep -q -- "BEGIN PGP" /usr/share/keyrings/alps-archive-keyring.gpg 2>/dev/null; then' >> pkg/DEBIAN/postinst
            echo '  if command -v gpg >/dev/null 2>&1; then' >> pkg/DEBIAN/postinst
            echo '    gpg --dearmor -o /usr/share/keyrings/alps-archive-keyring.gpg.tmp /usr/share/keyrings/alps-archive-keyring.gpg 2>/dev/null && \' >> pkg/DEBIAN/postinst
            echo '      mv -f /usr/share/keyrings/alps-archive-keyring.gpg.tmp /usr/share/keyrings/alps-archive-keyring.gpg 2>/dev/null || true' >> pkg/DEBIAN/postinst
            echo '  fi' >> pkg/DEBIAN/postinst
            echo 'fi' >> pkg/DEBIAN/postinst
            echo '' >> pkg/DEBIAN/postinst
            echo '# Update package list for alps repository' >> pkg/DEBIAN/postinst
            echo 'if command -v apt-get >/dev/null 2>&1; then' >> pkg/DEBIAN/postinst
            echo '  apt-get update -o Dir::Etc::sourcelist="sources.list.d/alps.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0" 2>/dev/null || apt-get update 2>/dev/null || true' >> pkg/DEBIAN/postinst
            echo 'fi' >> pkg/DEBIAN/postinst
            echo 'exit 0' >> pkg/DEBIAN/postinst
            chmod 755 pkg/DEBIAN/postinst

            dpkg-deb --build pkg alps_${TAG#v}_$DEBARCH.deb
          done

          rm -rf pkg

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: "*.deb"
          retention-days: 1

  package-termux:
    name: Build Termux Packages
    runs-on: ubuntu-latest
    needs: [build, build-termux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install termux-create-package
        run: pip install --break-system-packages termux-create-package

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Build Termux .deb packages
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
          VERSION=${TAG#v}

          # Completions are shell scripts — identical for every arch.
          # Generate them once from the native amd64 Linux binary, since the
          # Termux binaries are built for Android and can't run on this runner.
          chmod +x artifacts/alps-linux-amd64/alps-linux-amd64
          mkdir -p /tmp/alps-completions
          artifacts/alps-linux-amd64/alps-linux-amd64 completion fish > /tmp/alps-completions/alps.fish
          artifacts/alps-linux-amd64/alps-linux-amd64 completion bash > /tmp/alps-completions/alps
          artifacts/alps-linux-amd64/alps-linux-amd64 completion zsh > /tmp/alps-completions/_alps

          mkdir -p termux-debs

          mkdir -p /tmp/termux-control
          cat > /tmp/termux-control/postinst << 'EOF'
          #!/data/data/com.termux/files/usr/bin/sh
          set -e

          PREFIX="/data/data/com.termux/files/usr"
          chmod 644 "$PREFIX/share/keyrings/alps-archive-keyring.gpg" 2>/dev/null || true

          if [ -f "$PREFIX/share/keyrings/alps-archive-keyring.gpg" ] && grep -q -- "BEGIN PGP" "$PREFIX/share/keyrings/alps-archive-keyring.gpg" 2>/dev/null; then
            if command -v gpg >/dev/null 2>&1; then
              gpg --dearmor -o "$PREFIX/share/keyrings/alps-archive-keyring.gpg.tmp" "$PREFIX/share/keyrings/alps-archive-keyring.gpg" 2>/dev/null && \
                mv -f "$PREFIX/share/keyrings/alps-archive-keyring.gpg.tmp" "$PREFIX/share/keyrings/alps-archive-keyring.gpg" 2>/dev/null || true
            fi
          fi

          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -o Dir::Etc::sourcelist="sources.list.d/alps.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0" 2>/dev/null || apt update 2>/dev/null || true
          fi
          exit 0
          EOF
          chmod 755 /tmp/termux-control/postinst

          mkdir -p /tmp/termux-apt
          echo "deb [signed-by=/data/data/com.termux/files/usr/share/keyrings/alps-archive-keyring.gpg] https://adrianpriza-ai.github.io/alps-apt stable main" \
            > /tmp/termux-apt/alps.list

          # Map our build output names to Termux's dpkg architecture names
          # (aarch64 / arm / x86_64 / i686) — these are NOT the same as
          # Debian's amd64 / arm64 / armhf used by the regular .deb job.
          declare -A TERMUX_ARCH_MAP=(
            [alps-termux-aarch64]=aarch64
            [alps-termux-arm]=arm
            [alps-termux-x86_64]=x86_64
          )

          for OUTPUT in "${!TERMUX_ARCH_MAP[@]}"; do
            ARCH="${TERMUX_ARCH_MAP[$OUTPUT]}"
            BIN="$(pwd)/artifacts/$OUTPUT/$OUTPUT"
            chmod +x "$BIN"

            cat > "termux-manifest-$ARCH.json" << EOF
          {
            "name": "alps",
            "version": "$VERSION",
            "homepage": "https://github.com/adrianpriza-ai/alps",
            "maintainer": "@adrianpriza-ai",
            "description": "Advanced Linux Package System (Termux build)",
            "arch": "$ARCH",
            "control_files_dir": "/tmp/termux-control",
            "files": {
              "$BIN": "bin/alps",
              "/tmp/alps-completions/alps.fish": "share/fish/vendor_completions.d/alps.fish",
              "/tmp/alps-completions/alps": "share/bash-completion/completions/alps",
              "/tmp/alps-completions/_alps": "share/zsh/site-functions/_alps",
              "packaging/alps-archive-keyring.gpg": "share/keyrings/alps-archive-keyring.gpg",
              "/tmp/termux-apt/alps.list": "etc/apt/sources.list.d/alps.list"
            }
          }
          EOF

            termux-create-package "termux-manifest-$ARCH.json"
            mv ./*.deb "termux-debs/alps-termux_${VERSION}_${ARCH}.deb"
          done

      - name: Upload Termux .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: termux-debs
          path: termux-debs/*.deb
          retention-days: 1

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build, build-termux, package, package-termux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect binaries
        run: |
          mkdir -p binaries
          find artifacts/ -type f -exec cp {} binaries/ \;
          cp packaging/alps-archive-keyring.gpg binaries/
          cp packaging/alps-archive-keyring.asc binaries/

      - name: Generate checksums
        working-directory: binaries
        run: sha256sum * > SHA256SUMS

      - name: Generate release notes
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
          cat > release_notes.md << EOF
          ## ALPS ${TAG}

          **Advanced Linux Package System** — a single interface for every package manager.

          ### What's Included

          - **Multi-distro**: Auto-detects apt, dnf, pacman, zypper, and apk
          - **AUR support**: Full dependency resolution, PKGBUILD review, yay/paru fallback
          - **alps-more**: Cross-distro script repo with version tracking and mirror failover
          - **Extra managers**: Snap, Flatpak, and Winget integration
          - **Security**: HTTPS-only downloads, SHA-256 verification, GPG signature checks
          - **Platforms**: Linux (amd64/arm64/armv7), macOS (amd64/arm64), Termux (aarch64/arm/x86_64)

          ### Debian / Ubuntu (APT)

          \`\`\`bash
          sudo mkdir -p /usr/share/keyrings
          curl -fsSL https://adrianpriza-ai.github.io/alps-apt/alps-archive-keyring.gpg | sudo tee /usr/share/keyrings/alps-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/alps-archive-keyring.gpg] https://adrianpriza-ai.github.io/alps-apt stable main" | sudo tee /etc/apt/sources.list.d/alps.list >/dev/null
          sudo apt update && sudo apt install alps
          \`\`\`

          Or install a \`.deb\` directly: \`sudo dpkg -i alps_${TAG#v}_<arch>.deb\` (automatically configures the keyring and repository source).

          ### Termux

          \`\`\`bash
          curl -fsSL https://adrianpriza-ai.github.io/alps-apt/alps-archive-keyring.gpg \\
            -o \$PREFIX/share/keyrings/alps-archive-keyring.gpg
          echo "deb [signed-by=\$PREFIX/share/keyrings/alps-archive-keyring.gpg] https://adrianpriza-ai.github.io/alps-apt stable main" \\
            > \$PREFIX/etc/apt/sources.list.d/alps.list
          pkg update && pkg install alps
          \`\`\`

          Or install a single \`.deb\` directly with \`dpkg -i alps-termux_${TAG#v}_<arch>.deb\` (\`<arch>\` is \`aarch64\`, \`arm\`, or \`x86_64\`) — this also registers the repo and keyring automatically for future \`pkg upgrade\`s.

          ### Installation Script

          \`\`\`bash
          curl -fsSL https://alps-project.pages.dev/install.sh | sh
          \`\`\`

          Or download binaries from the assets below.

          ### Checksums

          See \`SHA256SUMS\` for file verification.
          EOF

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils

      - name: Clone APT repository
        run: |
          git clone --depth 1 \
            https://x-access-token:${{ secrets.REPO_TOKEN }}@github.com/adrianpriza-ai/alps-apt.git \
            repo

      - name: Update APT repository
        run: |
          TAG=${{ inputs.tag || github.ref_name }}

          cd repo

          # Dearmor existing keyring in repo if it was stored with ASCII armor
          if [ -f alps-archive-keyring.gpg ] && grep -q -- "BEGIN PGP" alps-archive-keyring.gpg; then
            echo "Converting existing ASCII-armored alps-archive-keyring.gpg to binary..."
            cp alps-archive-keyring.gpg alps-archive-keyring.asc
            gpg --dearmor -o alps-archive-keyring.gpg.tmp alps-archive-keyring.gpg
            mv -f alps-archive-keyring.gpg.tmp alps-archive-keyring.gpg
          fi

          mkdir -p pool/main/amd64
          mkdir -p pool/main/arm64
          mkdir -p pool/main/armhf
          mkdir -p pool/main/aarch64
          mkdir -p pool/main/arm
          mkdir -p pool/main/x86_64
          mkdir -p dists/stable/main/binary-amd64
          mkdir -p dists/stable/main/binary-arm64
          mkdir -p dists/stable/main/binary-armhf
          mkdir -p dists/stable/main/binary-aarch64
          mkdir -p dists/stable/main/binary-arm
          mkdir -p dists/stable/main/binary-x86_64
          mkdir -p dists/stable/main/binary-all

          cp ../binaries/alps_${TAG#v}_amd64.deb pool/main/amd64/
          cp ../binaries/alps_${TAG#v}_arm64.deb pool/main/arm64/
          cp ../binaries/alps_${TAG#v}_armhf.deb pool/main/armhf/
          # Termux packages: same repo, different (non-conflicting) arch names.
          cp ../binaries/alps-termux_${TAG#v}_aarch64.deb pool/main/aarch64/
          cp ../binaries/alps-termux_${TAG#v}_arm.deb pool/main/arm/
          cp ../binaries/alps-termux_${TAG#v}_x86_64.deb pool/main/x86_64/

          dpkg-scanpackages --multiversion pool/main/amd64 > dists/stable/main/binary-amd64/Packages
          gzip -kf dists/stable/main/binary-amd64/Packages

          dpkg-scanpackages --multiversion pool/main/arm64 > dists/stable/main/binary-arm64/Packages
          gzip -kf dists/stable/main/binary-arm64/Packages

          dpkg-scanpackages --multiversion pool/main/armhf > dists/stable/main/binary-armhf/Packages
          gzip -kf dists/stable/main/binary-armhf/Packages

          dpkg-scanpackages --multiversion pool/main/aarch64 > dists/stable/main/binary-aarch64/Packages
          gzip -kf dists/stable/main/binary-aarch64/Packages

          dpkg-scanpackages --multiversion pool/main/arm > dists/stable/main/binary-arm/Packages
          gzip -kf dists/stable/main/binary-arm/Packages

          dpkg-scanpackages --multiversion pool/main/x86_64 > dists/stable/main/binary-x86_64/Packages
          gzip -kf dists/stable/main/binary-x86_64/Packages

          touch dists/stable/main/binary-all/Packages
          gzip -kf dists/stable/main/binary-all/Packages

          echo "APT::FTPArchive::Release {" > apt.conf
          echo "  Origin \"ALPS\";" >> apt.conf
          echo "  Label \"ALPS\";" >> apt.conf
          echo "  Suite \"stable\";" >> apt.conf
          echo "  Codename \"stable\";" >> apt.conf
          echo "  Architectures \"amd64 arm64 armhf aarch64 arm x86_64 all\";" >> apt.conf
          echo "  Components \"main\";" >> apt.conf
          echo "  Description \"ALPS APT Repository\";" >> apt.conf
          echo "};" >> apt.conf

          apt-ftparchive \
            -c apt.conf \
            release dists/stable \
            > dists/stable/Release

          # Security: Generate signed InRelease file (requires GPG key setup)
          if [ -n "${{ secrets.APT_GPG_PRIVATE_KEY }}" ]; then
            export GPG_TTY=$(tty || echo /dev/null)
            mkdir -p ~/.gnupg
            chmod 700 ~/.gnupg
            echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
            echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
            gpgconf --kill gpg-agent

            echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.APT_GPG_PASSPHRASE }}" --import
            gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.APT_GPG_PASSPHRASE }}" --detach-sign --armor --output dists/stable/Release.gpg dists/stable/Release
            gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.APT_GPG_PASSPHRASE }}" --clearsign --output dists/stable/InRelease dists/stable/Release

            # Export binary keyring (.gpg) and ASCII-armored (.asc)
            gpg --batch --yes --export --output alps-archive-keyring.gpg
            gpg --batch --yes --armor --export --output alps-archive-keyring.asc
          else
            echo "Warning: APT_GPG_PRIVATE_KEY not set, using repository public key from project packaging"
            cp ../packaging/alps-archive-keyring.gpg alps-archive-keyring.gpg
            cp ../packaging/alps-archive-keyring.asc alps-archive-keyring.asc
            # Clean up stale signatures if private key is not available
            rm -f dists/stable/InRelease dists/stable/Release.gpg
          fi

          # Provide keyring inside dists/stable as well
          cp alps-archive-keyring.gpg dists/stable/alps-archive-keyring.gpg
          cp alps-archive-keyring.asc dists/stable/alps-archive-keyring.asc

          # Verify repository signature with gpgv
          if [ -f dists/stable/InRelease ]; then
            echo "Verifying InRelease signature with exported keyring..."
            gpgv --keyring ./alps-archive-keyring.gpg dists/stable/InRelease
            echo "Verification succeeded!"
          fi

      - name: Push APT repository
        run: |
          cd repo

          git config user.name github-actions
          git config user.email github-actions@github.com

          git add .
          git commit -m "Release ${{ inputs.tag || github.ref_name }}" || true
          git push

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "ALPS ${{ inputs.tag || github.ref_name }}"
          body_path: release_notes.md
          files: binaries/*
          generate_release_notes: false
