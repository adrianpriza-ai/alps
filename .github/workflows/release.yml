name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64  go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o alps-linux-amd64 .
          GOOS=linux GOARCH=arm64  go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o alps-linux-arm64 .
          GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o alps-linux-armv7 .

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            alps-linux-amd64
            alps-linux-arm64
            alps-linux-armv7
          generate_release_notes: true
